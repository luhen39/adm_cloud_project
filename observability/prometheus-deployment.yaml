---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerting-rules.yml
    scrape_configs:
      - job_name: 'api'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: api
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8000
            target_label: __address__
        metrics_path: '/metrics'
      - job_name: 'minio'
        static_configs:
          - targets: ['minio-service:9000']
        metrics_path: '/minio/health/cluster'
      - job_name: 'nginx-exporter'
        static_configs:
          - targets: ['nginx-service:9113']
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: default
data:
  alerting-rules.yml: |
    groups:
      - name: cloud_storage_alerts
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(nginx_http_requests_total[5m])) == 0
              or
              (
                sum(rate(nginx_http_requests_total[5m])) > 0
                and
                (
                  sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0)
                )
                /
                sum(rate(nginx_http_requests_total[5m])) > 0.05
              )
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Taxa de erros acima de 5%"
              description: "A taxa de erros 5xx está acima de 5% nos últimos 5 minutos."
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Latência P95 acima de 2 segundos"
              description: "A latência P95 está acima de 2 segundos nos últimos 5 minutos."
          - alert: HighCPU
            expr: |
              rate(process_cpu_seconds_total{job="api"}[5m]) > 0.8
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "CPU da API acima de 80%"
              description: "O uso de CPU do processo API está acima de 80%."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: alerting-rules
              mountPath: /etc/prometheus/alerting-rules.yml
              subPath: alerting-rules.yml
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: alerting-rules
          configMap:
            name: prometheus-alerting-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: default
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
