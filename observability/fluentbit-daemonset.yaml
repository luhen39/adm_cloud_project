apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentbit

rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentbit

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentbit

subjects:
  - kind: ServiceAccount
    name: fluentbit
    namespace: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: default

data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           1
        Daemon          Off
        Log_Level       info
        Parsers_File    parsers.conf

    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Parser              cri
        DB                  /var/fluentbit/flb_kube.db
        Mem_Buf_Limit       10MB
        Skip_Long_Lines     On
        Refresh_Interval    5

    [FILTER]
        Name                    kubernetes
        Match                   kube.*
        Kube_URL                https://kubernetes.default.svc:443
        Merge_Log               On
        Keep_Log                Off
        K8S-Logging.Parser      On
        K8S-Logging.Exclude     Off

    [OUTPUT]
        Name          loki
        Match         *
        Host          loki-service
        Port          3100
        Labels        job=fluentbit
        label_keys    $container_name,$namespace_name,$pod_name
        Auto_Kubernetes_Labels On

  parsers.conf: |
    [PARSER]
        Name          cri
        Format        regex
        Regex         ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key      time
        Time_Format   %Y-%m-%dT%H:%M:%S.%L%z

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  namespace: default

spec:
  selector:
    matchLabels:
      app: fluentbit

  template:
    metadata:
      labels:
        app: fluentbit

    spec:
      serviceAccountName: fluentbit

      containers:
        - name: fluentbit
          image: cr.fluentbit.io/fluent/fluent-bit:3.1

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: varfluentbit
              mountPath: /var/fluentbit

          resources:
            requests:
              cpu: 10m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: config
          configMap:
            name: fluentbit-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: varfluentbit
          emptyDir: {}