events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=download_zone:10m rate=60r/m;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Redirecionar HTTP -> HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL
        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Health check (público)
        location /health {
            proxy_pass http://api-service:8000/health;
        }

        # Métricas (apenas interno)
        location /metrics {
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://api-service:8000/metrics;
        }

        # Upload com rate limiting
        location /files/upload {
            limit_req zone=upload_zone burst=5 nodelay;
            auth_request /auth;
            proxy_pass http://api-service:8000;
        }

        # Download com rate limiting
        location /files/ {
            limit_req zone=download_zone burst=10 nodelay;
            auth_request /auth;
            proxy_pass http://api-service:8000;
        }

        # Auth endpoint
        location /auth/login {
            proxy_pass http://api-service:8000/auth/login;
        }

        # Validação de token (auth_request)
        location = /auth {
            internal;
            proxy_pass http://api-service:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Todas as outras rotas autenticadas
        location / {
            auth_request /auth;
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
