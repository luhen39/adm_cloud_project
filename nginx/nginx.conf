events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=download_zone:10m rate=60r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # stub_status para o NGINX Exporter
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    # Health check público (sem auth)
    location /health {
        proxy_pass http://api-service:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Login público (sem auth)
    location /auth/login {
        proxy_pass http://api-service:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Upload com rate limit
    location /files/upload {
        auth_basic "Project Dropbox";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        limit_req zone=upload_zone burst=5 nodelay;
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Download/List/Share/Delete com rate limit
    location /files/ {
        auth_basic "Project Dropbox";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        limit_req zone=download_zone burst=10 nodelay;
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Resto protegido
    location / {
        auth_basic "Project Dropbox";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
}
