events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=download_zone:10m rate=60r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Só redireciona para OAuth se NÃO tiver Authorization header
        set $do_redirect 1;
        if ($http_authorization) {
            set $do_redirect 0;
        }

        error_page 401 = @login_redirect;

        # stub_status para o NGINX Exporter
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        # Health check público
        location /health {
            proxy_pass http://api-service:8000/health;
            proxy_set_header Host $host;
        }

        # Login público
        location /auth/login {
            proxy_pass http://api-service:8000/auth/login;
            proxy_set_header Host $host;
        }

        # Upload - OAuth2-Proxy
        location /files/upload {
            auth_request /oauth2/auth;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            limit_req zone=upload_zone burst=5 nodelay;
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        # Download/List/Share/Delete - OAuth2-Proxy (com barra)
        location /files/ {
            auth_request /oauth2/auth;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            limit_req zone=download_zone burst=10 nodelay;
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        # Download/List/Share/Delete - OAuth2-Proxy (sem barra)
        location /files {
            auth_request /oauth2/auth;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            limit_req zone=download_zone burst=10 nodelay;
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        # Resto - OAuth2-Proxy
        location / {
            auth_request /oauth2/auth;
            auth_request_set $auth_user $upstream_http_x_forwarded_user;
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $auth_user;
        }

        # Endpoint de validação do OAuth2-Proxy
        location /oauth2/ {
            proxy_pass http://127.0.0.1:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Auth-Request-Redirect $request_uri;
        }

        # Redirecionamento para login Google (respeita $do_redirect)
        location @login_redirect {
            if ($do_redirect = 0) {
                return 401;
            }
            return 302 /oauth2/sign_in?rd=$request_uri;
        }
    }
}