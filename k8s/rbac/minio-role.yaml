apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: minio-sa
    namespace: default
roleRef:
  kind: Role
  name: minio-role
  apiGroup: rbac.authorization.k8s.io