---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
        limit_req_zone $binary_remote_addr zone=download_zone:10m rate=60r/m;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        server {
            listen 80;
            server_name _;
            return 301 https://$host$request_uri;
        }

        server {
            listen 443 ssl;
            server_name _;

            ssl_certificate     /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols       TLSv1.2 TLSv1.3;

            # Location especial para o OAuth2-Proxy (sem auth_request para evitar loop)
            location /oauth2/ {
                proxy_pass http://127.0.0.1:4180;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Scheme $scheme;
                proxy_set_header Auth-Request-Redirect $request_uri;
            }

            # Endpoint de autenticação - usando o caminho correto do OAuth2-Proxy
            location = /oauth2/auth {
                internal;
                proxy_pass http://127.0.0.1:4180/oauth2/auth;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header X-Original-URI $request_uri;
                proxy_set_header X-Original-Method $request_method;
                proxy_set_header X-Original-Remote-Addr $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # stub_status para o NGINX Exporter
            location /stub_status {
                stub_status;
                allow 127.0.0.1;
                deny all;
            }

            # Health check público
            location /health {
                proxy_pass http://api-service:8000/health;
                proxy_set_header Host $host;
            }

            # Login público
            location /auth/login {
                proxy_pass http://api-service:8000/auth/login;
                proxy_set_header Host $host;
            }

            # Protegido por OAuth2-Proxy
            location /files/upload {
                auth_request /oauth2/auth;
                auth_request_set $auth_user $upstream_http_x_forwarded_user;
                auth_request_set $auth_email $upstream_http_x_forwarded_email;
                
                limit_req zone=upload_zone burst=5 nodelay;
                
                proxy_pass http://api-service:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-User $auth_user;
                proxy_set_header X-Forwarded-Email $auth_email;
                proxy_set_header Authorization $http_authorization;
                
                error_page 401 = @login_redirect;
            }

            location /files/ {
                auth_request /oauth2/auth;
                auth_request_set $auth_user $upstream_http_x_forwarded_user;
                auth_request_set $auth_email $upstream_http_x_forwarded_email;
                
                limit_req zone=download_zone burst=10 nodelay;
                
                proxy_pass http://api-service:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-User $auth_user;
                proxy_set_header X-Forwarded-Email $auth_email;
                proxy_set_header Authorization $http_authorization;
                
                error_page 401 = @login_redirect;
            }

            location /files {
                auth_request /oauth2/auth;
                auth_request_set $auth_user $upstream_http_x_forwarded_user;
                auth_request_set $auth_email $upstream_http_x_forwarded_email;
                
                limit_req zone=download_zone burst=10 nodelay;
                
                proxy_pass http://api-service:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-User $auth_user;
                proxy_set_header X-Forwarded-Email $auth_email;
                proxy_set_header Authorization $http_authorization;
                
                error_page 401 = @login_redirect;
            }

            location / {
                auth_request /oauth2/auth;
                auth_request_set $auth_user $upstream_http_x_forwarded_user;
                auth_request_set $auth_email $upstream_http_x_forwarded_email;
                
                proxy_pass http://api-service:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-User $auth_user;
                proxy_set_header X-Forwarded-Email $auth_email;
                proxy_set_header Authorization $http_authorization;
                
                error_page 401 = @login_redirect;
            }

            # Redirecionamento para login
            location @login_redirect {
                return 302 /oauth2/sign_in?rd=$request_uri;
            }
        }
    }